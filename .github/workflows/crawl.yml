# This workflow is synced to the public repository by sync-crawl-workflows.yml
# It runs in the PUBLIC repo and clones the PRIVATE repo to execute crawlers.
#
# Required secrets in the PUBLIC repo:
#   PRIVATE_REPO_PAT  - GitHub PAT with access to the private heyboss-wtf repo
#   CRAWL_API_KEY_PROD - API key for production (main branch)
#   CRAWL_API_KEY_DEV  - API key for development (development branch)

name: Crawl Companies

on:
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM UTC
  workflow_dispatch:
    inputs:
      source:
        description: 'Run a specific source only (leave empty for all)'
        required: false
        type: choice
        options:
          - 'All source'
          - itviec
          - vietnamworks
          - topcv

permissions:
  contents: read

env:
  CHUNK_SIZE: '200'

jobs:
  # ===========================================================================
  # Discover: fetch ITViec sitemap, compute chunk count for parallel crawling
  # ===========================================================================
  discover-itviec:
    name: Discover ITViec URLs
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || inputs.source == 'All source' || inputs.source == 'itviec'
    outputs:
      chunks: ${{ steps.discover.outputs.chunks }}
      total_new: ${{ steps.discover.outputs.total_new }}
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @heyboss/crawlers...

      - name: Install Puppeteer Chrome
        run: pnpm --filter @heyboss/crawlers exec puppeteer browsers install chrome

      - name: Set environment variables
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "API_URL=https://api.heyboss.wtf" >> $GITHUB_ENV
            echo "CRAWL_API_KEY=${{ secrets.CRAWL_API_KEY_PROD }}" >> $GITHUB_ENV
          else
            echo "API_URL=https://heyboss-api-dev.heyboss.workers.dev" >> $GITHUB_ENV
            echo "CRAWL_API_KEY=${{ secrets.CRAWL_API_KEY_DEV }}" >> $GITHUB_ENV
          fi

      - name: Discover new company URLs
        id: discover
        run: |
          OUTPUT=$(pnpm --filter @heyboss/crawlers crawl:discover:itviec 2>&1)
          echo "$OUTPUT"
          CHUNKS=$(echo "$OUTPUT" | grep '^CHUNKS=' | cut -d= -f2)
          TOTAL_NEW=$(echo "$OUTPUT" | grep '^TOTAL_NEW=' | cut -d= -f2)
          echo "chunks=${CHUNKS}" >> $GITHUB_OUTPUT
          echo "total_new=${TOTAL_NEW}" >> $GITHUB_OUTPUT
        env:
          API_URL: ${{ env.API_URL }}
          CRAWL_API_KEY: ${{ env.CRAWL_API_KEY }}
          CHUNK_SIZE: ${{ env.CHUNK_SIZE }}

  # ===========================================================================
  # Crawl ITViec: parallel chunks of CHUNK_SIZE companies each
  # ===========================================================================
  crawl-itviec:
    name: Crawl itviec (chunk ${{ matrix.chunk }})
    runs-on: ubuntu-latest
    needs: discover-itviec
    if: needs.discover-itviec.outputs.total_new != '0'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        chunk: ${{ fromJson(needs.discover-itviec.outputs.chunks) }}
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter @heyboss/crawlers...

      - name: Install Puppeteer Chrome
        run: pnpm --filter @heyboss/crawlers exec puppeteer browsers install chrome

      - name: Set environment variables
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "API_URL=https://api.heyboss.wtf" >> $GITHUB_ENV
            echo "CRAWL_API_KEY=${{ secrets.CRAWL_API_KEY_PROD }}" >> $GITHUB_ENV
          else
            echo "API_URL=https://heyboss-api-dev.heyboss.workers.dev" >> $GITHUB_ENV
            echo "CRAWL_API_KEY=${{ secrets.CRAWL_API_KEY_DEV }}" >> $GITHUB_ENV
          fi

      - name: Crawl itviec (chunk ${{ matrix.chunk }})
        run: |
          OFFSET=$(( ${{ matrix.chunk }} * ${{ env.CHUNK_SIZE }} ))
          pnpm --filter @heyboss/crawlers crawl:companies:itviec -- --offset $OFFSET --limit ${{ env.CHUNK_SIZE }}
        env:
          API_URL: ${{ env.API_URL }}
          CRAWL_API_KEY: ${{ env.CRAWL_API_KEY }}

